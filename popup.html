<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sEnd2End</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 320px;
        padding: 14px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .status-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .key-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .key-line code {
        color: var(--text);
      }
      .actions {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      footer {
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="icons/logo.svg" alt="" />
        <div>
          <div class="brand-name">s<span>End2End</span></div>
          <div class="brand-sub">Keys stay on this device</div>
        </div>
      </div>
    </header>

    <section class="card">
      <div class="status-head">
        <span class="card-title" style="margin: 0">This tab</span>
        <span class="pill" id="pill">Checking…</span>
      </div>
      <code class="origin" id="site">Reading the active tab…</code>
      <div class="key-line">
        <span>Your key</span>
        <code id="keyState">…</code>
      </div>
    </section>

    <div class="actions">
      <button id="connect" class="btn btn-primary btn-block" type="button">Connect this site</button>
      <button id="options" class="btn btn-block" type="button">Keys &amp; connected sites</button>
    </div>

    <footer>
      <p class="toast" id="msg"></p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
